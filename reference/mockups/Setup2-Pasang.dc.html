<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Setup — pasang scrcpy dan ADB</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7FE3AB}a:hover{color:#B4F0CD}
button{font:inherit;cursor:pointer}
.sl-radio{width:16px;height:16px;margin:2px 0 0;accent-color:#3DDC84;flex-shrink:0}
</style>
</helmet>
<div style="width: 640px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #1F2228; color: #ECEEF1; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden">

  <!-- Title bar -->
  <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 14px; background: #111317; border-bottom: 1px solid #262A31">
    <span style="font-size: 12px; color: #C9CDD4">Setup scrcpy Launcher</span>
    <button aria-label="Tutup" style="width: 46px; height: 36px; border: 0; background: transparent; color: #C9CDD4; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></button>
  </div>

  <!-- Stepper -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 24px 14px">
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #3DDC84; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B1F13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="font-size: 12px; color: #C9CDD4">Deteksi</span></span>
    <span style="flex: 1; height: 2px; background: #3DDC84"></span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #3DDC84; color: #3DDC84; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 12px; font-weight: 600">Pasang</span></span>
    <span style="flex: 1; height: 2px; background: #343944"></span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #3A3F4A; color: #A7ADB8; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 12px; color: #A7ADB8">Verifikasi</span></span>
    <span style="flex: 1; height: 2px; background: #343944"></span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #3A3F4A; color: #A7ADB8; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">4</span><span style="font-size: 12px; color: #A7ADB8">Selesai</span></span>
  </div>

  <!-- Content -->
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 6px 24px 16px">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Pasang scrcpy &amp; ADB</h1>

    <!-- Option: auto download (selected, in progress) -->
    <label style="display: flex; gap: 12px; padding: 12px 14px; border: 1px solid #3DDC84; border-radius: 8px; background: #1C2B22">
      <input type="radio" name="install" class="sl-radio" checked="checked">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 600">Unduh otomatis</span><span style="padding: 2px 8px; border-radius: 999px; background: #23402E; color: #8BEAB4; font-size: 11px; font-weight: 600">Disarankan</span></span>
        <span style="font-size: 12px; color: #A7ADB8; line-height: 1.45">scrcpy 4.1 resmi dari GitHub, sudah termasuk ADB. Disimpan di folder aplikasi, tidak mengubah sistem.</span>
        <span style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
          <span style="display: flex; justify-content: space-between; font-size: 12px; color: #C9CDD4"><span>Mengunduh scrcpy-win64-v4.1.zip</span><span>7,0 / 11,3 MB</span></span>
          <span style="height: 6px; border-radius: 3px; background: #2F333C; overflow: hidden"><span style="display: block; width: 62%; height: 6px; background: #3DDC84"></span></span>
          <span style="font-size: 11px; color: #A7ADB8">Setelah selesai: cocokkan SHA-256 → ekstrak → buka blokir file</span>
        </span>
      </span>
    </label>

    <!-- Option: winget -->
    <label style="display: flex; gap: 12px; padding: 12px 14px; border: 1px solid #343944; border-radius: 8px; background: #262A31">
      <input type="radio" name="install" class="sl-radio">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600">Pasang lewat winget</span>
        <span style="font-size: 12px; color: #A7ADB8; line-height: 1.45">Terpasang untuk sistem dan bisa diperbarui lewat winget.</span>
        <code style="align-self: flex-start; padding: 4px 8px; border-radius: 4px; background: #17191E; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: #C9CDD4">winget install Genymobile.scrcpy</code>
      </span>
    </label>

    <!-- Option: existing folder -->
    <label style="display: flex; gap: 12px; padding: 12px 14px; border: 1px solid #343944; border-radius: 8px; background: #262A31">
      <input type="radio" name="install" class="sl-radio">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 600">Pakai folder yang sudah ada</span>
        <span style="font-size: 12px; color: #A7ADB8; line-height: 1.45">Pilih folder berisi scrcpy.exe dan adb.exe.</span>
      </span>
      <span style="align-self: center; height: 32px; padding: 0 12px; display: flex; align-items: center; border: 1px solid #3A3F4A; border-radius: 6px; color: #ECEEF1; font-size: 12px">Pilih folder…</span>
    </label>
  </div>

  <!-- Footer -->
  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-top: 1px solid #2C3039">
    <button style="height: 40px; padding: 0 16px; border: 1px solid #3A3F4A; border-radius: 6px; background: #262A31; color: #ECEEF1; font-size: 13px">Kembali</button>
    <div style="display: flex; gap: 10px">
      <button style="height: 40px; padding: 0 16px; border: 1px solid #3A3F4A; border-radius: 6px; background: #262A31; color: #ECEEF1; font-size: 13px">Batalkan unduhan</button>
      <button disabled="disabled" style="height: 40px; padding: 0 20px; border: 0; border-radius: 6px; background: #2F333C; color: #8A909C; font-size: 14px; font-weight: 600">Memasang… 62%</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":560}}'>

  renderVals() {
    return {};
  }

</body>
</html>
